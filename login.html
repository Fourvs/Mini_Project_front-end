<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkillPath AI | Login</title>
  <link rel="stylesheet" href="output.css" />
</head>

<body class="bg-[#0f0f0f] text-white min-h-screen flex items-center justify-center">

  <!-- Background glow -->
  <div class="absolute inset-0 bg-gradient-to-br from-orange-500/10 to-transparent blur-2xl"></div>

  <div class="relative w-full max-w-5xl flex rounded-3xl overflow-hidden shadow-2xl">

    <!-- LEFT -->
    <div class="hidden md:flex flex-col justify-center w-1/2 bg-[#1a1a1a] p-10">
      <h1 class="text-4xl font-extrabold mb-4">
        SkillPath <span class="text-orange-500">AI</span>
      </h1>
      <p class="text-gray-400 text-lg">
        Your personalized AI mentor for structured learning and career growth.
      </p>
    </div>

    <!-- RIGHT -->
    <div class="w-full md:w-1/2 bg-[#181818] p-10 flex flex-col justify-center">

      <h2 class="text-3xl font-bold mb-6">Welcome Back</h2>

      <input type="text" placeholder="Email"
        class="bg-[#252525] border border-gray-700 px-4 py-3 rounded-xl mb-4 focus:border-orange-500 focus:outline-none" />

      <input type="password" placeholder="Password"
        class="bg-[#252525] border border-gray-700 px-4 py-3 rounded-xl mb-4 focus:border-orange-500 focus:outline-none" />

      <button onclick="loginUser()"
        class="bg-orange-500 hover:bg-orange-600 py-3 rounded-xl font-semibold text-lg transition">
        Log In
      </button>

      <p class="text-center text-sm text-gray-400 mt-4 cursor-pointer hover:text-orange-400">
        Forgot password?
      </p>

      <div class="flex items-center my-6">
        <div class="flex-1 h-px bg-gray-700"></div>
        <span class="px-3 text-gray-400 text-sm">OR</span>
        <div class="flex-1 h-px bg-gray-700"></div>
      </div>

      <button
        class="bg-[#252525] hover:bg-[#2d2d2d] py-3 rounded-xl border border-gray-700">
        Continue with Google
      </button>

    </div>
  </div>

  <script src="script.js"></script>

</body>
</html>
